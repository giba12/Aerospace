[pytest]
# python/ holds analyze.py, tools/ holds trace.py; both are importable from tests.
pythonpath = python tools
testpaths = tests/system tests/python
addopts = --strict-markers -p no:cacheprovider
markers =
    req(*ids): requirement IDs this test verifies (TST-005); read by tools/trace.py
junit_family = xunit1
