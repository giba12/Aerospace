[pytest]
# python/ holds analyze.py, tools/ holds req_trace.py; both are importable from tests.
pythonpath = python tools tests
testpaths = tests/system tests/python
addopts = --strict-markers -p no:cacheprovider
markers =
    req(*ids): requirement IDs this test verifies (TST-005); read by tools/req_trace.py
junit_family = xunit1
