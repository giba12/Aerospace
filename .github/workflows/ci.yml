name: ci

# TST-009: every push and pull request. The commands below are the README's commands (SYS-001);
# if the two ever differ, SYS-001 is failing.
on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Pinned: ubuntu-latest moves to a newer image and would silently change the toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cxx: g++-13
          - compiler: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-venv g++-13 clang-18

      - name: Python environment (pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSIM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      # NFR-006: the whole suite, ensembles included, must stay inside 30 seconds.
      - name: Time budget
        run: >
          .venv/bin/python tools/check_budget.py --limit 30
          --junit build/test-reports/gtest.xml build/test-reports/pytest.xml

      # The README's step 4: run the simulator and analyze it, so the plot and metrics.json are
      # produced on every push and uploaded below.
      - name: Example run and analysis
        run: |
          ./build/sim --steps 1000 --out build/test-reports/run.csv
          .venv/bin/python python/analyze.py build/test-reports/run.csv \
            --metrics-json build/test-reports/metrics.json --plot build/test-reports/plot.png

      # TST-011, SYS-005: the gate. It fails the build if a test cites an unknown requirement, a test
      # cites none, or ANY Must requirement has no passing test.
      - name: Traceability
        run: >
          .venv/bin/python tools/req_trace.py --requirements docs/requirements.csv
          --junit build/test-reports/gtest.xml build/test-reports/pytest.xml
          --matrix-out build/test-reports/traceability.md --require-coverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          retention-days: 30
          name: reports-${{ matrix.compiler }}
          path: build/test-reports/

  # NFR-007: the whole suite under AddressSanitizer and UndefinedBehaviorSanitizer. Any finding aborts
  # the process, so it fails the job. Not held to the 30 s budget: sanitized code is slower by design.
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-venv g++-13

      - name: Python environment (pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DSIM_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: cd build && ctest --output-on-failure

  # NFR-008: line and branch coverage of src/ and include/. The goal is 90 % of lines, REPORTED here
  # and never a gate (the baseline says so). GCC 13 has no condition coverage (risk R-08).
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-venv g++-13

      - name: Python environment (pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r python/requirements.txt

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DSIM_COVERAGE=ON -DSIM_GCOV=gcov-13

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Coverage report
        run: |
          cmake --build build --target coverage
          { echo '### Coverage of src/ and include/'; echo '```'; cat build/coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          retention-days: 30
          name: coverage
          path: build/coverage/

  # SYS-001 / VAL-01: a clean-room run. Building the image compiles the program from a fresh copy of
  # the source, installs the pinned Python packages and runs the whole test suite inside it, so the
  # build fails if any test does. Then the image is run once, exactly as the README says.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build the image (runs the whole test suite inside it)
        run: docker build -t sensor-sim .

      - name: Run the reference scenario in the container
        run: |
          mkdir out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" sensor-sim
          test -s out/run.csv && test -s out/run.csv.config.json && test -s out/metrics.json && test -s out/plot.png
          python3 -c "import json; m = json.load(open('out/metrics.json')); r = m['improvement_ratio']; print('improvement_ratio', r); assert 0 < r < 0.75"

      - name: Upload container outputs
        uses: actions/upload-artifact@v6
        with:
          retention-days: 30
          name: container-output
          path: out/
